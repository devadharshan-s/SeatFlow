spring.application.name=bookmyshow-theatre-service
server.port=8087

spring.datasource.url=jdbc:mysql://localhost:3306/bookmyshow_theatre
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:@Shawn123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/bookmyshow

# Eureka Service Discovery configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

