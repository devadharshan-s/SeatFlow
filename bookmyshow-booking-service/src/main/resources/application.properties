spring.application.name=bookmyshow-booking-service
server.port=8085

spring.datasource.url=jdbc:mysql://localhost:3306/bookmyshow_booking
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:@Shawn123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=BookMyShowBookingHikariPool
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/bookmyshow

# Eureka Service Discovery configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

services.auth.token-url=http://localhost:8080/realms/bookmyshow/protocol/openid-connect/token
services.auth.client-id=bookmyshow-admin
services.auth.client-secret=${KEYCLOAK_CLIENT_SECRET:change-me}

spring.profiles.active=local

# Redis configuration (shared instance with show-service, namespaced by key prefix)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=6000ms

# Resilience4j Retry — exponential backoff (500ms -> 1s -> 2s), 3 attempts
resilience4j.retry.instances.seatService.max-attempts=3
resilience4j.retry.instances.seatService.wait-duration=500ms
resilience4j.retry.instances.seatService.enable-exponential-backoff=true
resilience4j.retry.instances.seatService.exponential-backoff-multiplier=2.0
resilience4j.retry.instances.seatService.retry-exceptions=java.io.IOException,java.util.concurrent.TimeoutException,org.example.bookmyshowbookingservice.common.exception.DownstreamServiceException

# Resilience4j Circuit Breaker — opens after 50% failure rate in 10-call window
resilience4j.circuitbreaker.instances.seatServiceCircuit.sliding-window-type=count_based
resilience4j.circuitbreaker.instances.seatServiceCircuit.sliding-window-size=10
resilience4j.circuitbreaker.instances.seatServiceCircuit.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.seatServiceCircuit.wait-duration-in-open-state=15000ms
resilience4j.circuitbreaker.instances.seatServiceCircuit.permitted-number-of-calls-in-half-open-state=3

# Resilience4j TimeLimiter — prevents hanging Feign calls
resilience4j.timelimiter.instances.seatService.timeout-duration=5s
resilience4j.timelimiter.instances.seatService.cancel-running-future=true
