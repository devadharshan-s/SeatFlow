version: '3.8'

services:
  # MySQL Database Service
  mysql-db:
    image: mysql:8.0
    container_name: seatflow-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "@Shawn123"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p@Shawn123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak IAM Service
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.3
    container_name: seatflow-keycloak
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\" >&3 && close 3"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 1. Netflix Eureka Discovery Server
  eureka-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: bookmyshow-eureka-server
    container_name: seatflow-eureka-server
    ports:
      - "8761:8761"
    environment:
      SPRING_APPLICATION_NAME: bookmyshow-eureka-server
      SERVER_PORT: 8761
      EUREKA_CLIENT_REGISTERWITHEUREKA: "false"
      EUREKA_CLIENT_FETCHREGISTRY: "false"
    develop:
      watch:
        - action: rebuild
          path: ./bookmyshow-eureka-server/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  # 2. Theatre Service
  theatre-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: bookmyshow-theatre-service
    container_name: seatflow-theatre-service
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/bookmyshow_theatre?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "@Shawn123"
      DB_PASSWORD: "@Shawn123"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/bookmyshow
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/bookmyshow/protocol/openid-connect/certs
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    develop:
      watch:
        - action: rebuild
          path: ./bookmyshow-theatre-service/src

  # 3. Movie Service
  movie-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: bookmyshow-movie-service
    container_name: seatflow-movie-service
    ports:
      - "8088:8088"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/bookmyshow_movie?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "@Shawn123"
      DB_PASSWORD: "@Shawn123"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/bookmyshow
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/bookmyshow/protocol/openid-connect/certs
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    develop:
      watch:
        - action: rebuild
          path: ./bookmyshow-movie-service/src

  # 4. User Service
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: bookmyshow-user-service
    container_name: seatflow-user-service
    ports:
      - "8089:8089"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/bookmyshow_user?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "@Shawn123"
      DB_PASSWORD: "@Shawn123"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/bookmyshow
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/bookmyshow/protocol/openid-connect/certs
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: bookmyshow
      KEYCLOAK_ADMIN_CLIENT_ID: bookmyshow-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: change-me
    depends_on:
      mysql-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      eureka-server:
        condition: service_started
    develop:
      watch:
        - action: rebuild
          path: ./bookmyshow-user-service/src

  # 5. Show Service
  show-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: bookmyshow-show-service
    container_name: seatflow-show-service
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/bookmyshow_show?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "@Shawn123"
      DB_PASSWORD: "@Shawn123"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/bookmyshow
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/bookmyshow/protocol/openid-connect/certs
      SERVICES_AUTH_TOKEN_URL: http://keycloak:8080/realms/bookmyshow/protocol/openid-connect/token
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    develop:
      watch:
        - action: rebuild
          path: ./bookmyshow-show-service/src

  # 6. Booking Service
  booking-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: bookmyshow-booking-service
    container_name: seatflow-booking-service
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/bookmyshow_booking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "@Shawn123"
      DB_PASSWORD: "@Shawn123"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/bookmyshow
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/bookmyshow/protocol/openid-connect/certs
      SERVICES_AUTH_TOKEN_URL: http://keycloak:8080/realms/bookmyshow/protocol/openid-connect/token
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    develop:
      watch:
        - action: rebuild
          path: ./bookmyshow-booking-service/src

  # 7. Payment Service
  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: bookmyshow-payment-service
    container_name: seatflow-payment-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/bookmyshow_payment?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "@Shawn123"
      DB_PASSWORD: "@Shawn123"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/bookmyshow
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/bookmyshow/protocol/openid-connect/certs
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    develop:
      watch:
        - action: rebuild
          path: ./bookmyshow-payment-service/src

volumes:
  mysql-data:
