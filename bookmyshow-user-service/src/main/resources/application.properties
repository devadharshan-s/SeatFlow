spring.application.name=bookmyshow-user-service
server.port=8089

spring.datasource.url=jdbc:mysql://localhost:3306/bookmyshow_user
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:@Shawn123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/bookmyshow

# Eureka Service Discovery configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

keycloak.auth-server-url=http://localhost:8080
keycloak.realm=bookmyshow
keycloak.admin.client-id=bookmyshow-admin
keycloak.admin.client-secret=${KEYCLOAK_CLIENT_SECRET:change-me}
